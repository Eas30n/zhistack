# 镜像全部本地构建，不依赖任何镜像仓库。
# 国内网络可切换加速源：BASE_REGISTRY=docker.m.daocloud.io/ docker compose up -d --build
services:
  mysql:
    image: ${BASE_REGISTRY:-}mysql:8.0
    container_name: zhistack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: zhistack
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/zhistack.sql:/docker-entrypoint-initdb.d/01-zhistack.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: ${BASE_REGISTRY:-}redis:7-alpine
    container_name: zhistack-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    container_name: zhistack-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_HOST: redis
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${BASE_REGISTRY:-}nginx:1.25-alpine
    container_name: zhistack-web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo-frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
